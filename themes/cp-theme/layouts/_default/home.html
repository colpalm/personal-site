{{ define "main" }}
<div class="home-centered">
  <div class="home-container">
    {{ partial "wave.html" . }}
    <div class="home-intro">
      <h1 class="home-name">{{ site.Params.author }}</h1>
      <p class="home-tagline">{{ site.Params.tagline }}</p>
    </div>
    <div class="social-icons">
      <a href="https://github.com/colpalm" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        {{ partial "icon.html" "github" }}
      </a>
      <a href="https://linkedin.com/in/palmercolin" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        {{ partial "icon.html" "linkedin" }}
      </a>
    </div>
  </div>
</div>
{{ end }}
