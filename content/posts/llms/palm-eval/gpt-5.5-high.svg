<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Palm Tree Surfing a Wave</title>
  <desc id="desc">A playful cartoon palm tree wearing sunglasses and riding a surfboard on a curling blue ocean wave.</desc>

  <defs>
    <linearGradient id="wave" x1="140" y1="650" x2="690" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33BFE4"/>
      <stop offset="0.45" stop-color="#0699D1"/>
      <stop offset="1" stop-color="#0068A8"/>
    </linearGradient>
    <linearGradient id="waveDark" x1="510" y1="270" x2="650" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#047FC2"/>
      <stop offset="1" stop-color="#004C8D"/>
    </linearGradient>
    <linearGradient id="board" x1="190" y1="590" x2="580" y2="545" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9C1C"/>
      <stop offset="0.45" stop-color="#FFD33E"/>
      <stop offset="1" stop-color="#FFB82C"/>
    </linearGradient>
    <linearGradient id="trunk" x1="325" y1="280" x2="435" y2="670" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B96518"/>
      <stop offset="0.52" stop-color="#C77B22"/>
      <stop offset="1" stop-color="#8F5119"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
