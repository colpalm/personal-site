    />
    <path
      d="
        M400 299
        L420 302
        C433 305 439 317 433 328
        L422 342
        C414 351 398 347 395 334
        L392 318
        C390 306 389 300 400 299Z
      "
      fill="#102936"
    />
    <path
      d="M386 312 C390 310 394 310 399 312"
      fill="none"
      stroke="#102936"
      stroke-width="7"
    />

    <!-- lens shine -->
    <path
      d="M353 309 L372 306"
      stroke="#37697C"
      stroke-width="5"
      stroke-linecap="round"
      opacity=".8"
    />
    <path
      d="M404 307 L421 312"
      stroke="#37697C"
      stroke-width="5"
      stroke-linecap="round"
      opacity=".8"
    />

    <!-- smile -->
    <path
      d="
        M360 354
        C377 374 405 376 421 353
        C412 385 376 391 360 354Z
      "
      fill="#5B2218"
    />
    <path
      d="
        M364 355
