<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 800 800"
  width="800"
  height="800"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Palm Tree Surfing a Wave</title>
  <desc id="desc">
    A playful palm tree riding a surfboard on a curling tropical wave.
  </desc>

  <defs>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42C5D1"/>
      <stop offset="55%" stop-color="#0497AA"/>
      <stop offset="100%" stop-color="#006B85"/>
    </linearGradient>

    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFD84A"/>
      <stop offset="100%" stop-color="#FF9D24"/>
    </linearGradient>

    <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B551F"/>
      <stop offset="50%" stop-color="#C9792B"/>
      <stop offset="100%" stop-color="#8B481C"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="8"
        flood-color="#003B49"
        flood-opacity=".18"
      />
    </filter>
  </defs>

  <!-- Wave -->
  <g filter="url(#shadow)">
    <path
      d="
        M110 610
        C175 708 330 730 478 685
        C645 635 724 492 683 354
        C657 269 586 226 510 243
        C594 258 625 311 607 360
        C586 417 518 406 482 381
        C522 446 489 507 438 540
        C377 579 290 577 221 549
        C170 528 133 550 110 610Z
      "
      fill="url(#waveGrad)"
    />

    <!-- Inner barrel -->
    <path
      d="
        M486 271
        C566 263 633 315 628 387
        C625 431 593 464 550 479
        C578 445 576 410 554 385
        C528 356 487 351 450 370
        C470 335 478 299 486 271Z
      "
      fill="#00788E"
    />

    <path
      d="
        M130 590
        C211 638 316 646 414 611
        C335 671 205 684 130 590Z
      "
      fill="#58D1D7"
    />

    <path
      d="
        M167 610
        C252 638 357 620 431 570
      "
      fill="none"
      stroke="#B9F5F4"
      stroke-width="20"
      stroke-linecap="round"
    />

    <!-- Foam -->
    <path
      d="
        M481 249
        C500 219 533 218 549 240
        C566 211 605 220 610 250
        C641 231 671 251 667 282
        C700 280 711 315 693 339
        C723 348 722 386 694 400
        C704 432 672 451 649 432
        C635 451 620 461 603 467
        C628 424 629 390 610 357
        C587 316 542 291 481 300Z
      "
      fill="#FFFFFF"
    />

    <path
      d="
        M473 272
        C513 250 560 260 593 291
      "
      fill="none"
      stroke="#BDEFF2"
      stroke-width="16"
      stroke-linecap="round"
    />

    <!-- Water droplets -->
    <circle cx="673" cy="239" r="10" fill="#64CFD8"/>
    <circle cx="710" cy="294" r="7" fill="#64CFD8"/>
    <circle cx="650" cy="198" r="8" fill="#64CFD8"/>
    <circle cx="162" cy="523" r="8" fill="#64CFD8"/>
  </g>

  <!-- Surfboard -->
  <g transform="rotate(-13 360 560)" filter="url(#shadow)">
    <path
      d="
        M170 562
        C236 520 378 500 523 517
        C552 521 566 531 552 542
        C496 587 343 618 198 604
        C163 600 146 580 170 562Z
